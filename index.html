<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta name="description" content="个人电子名片">
<title>张三 · 个人名片</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#eef1f6; --card:#ffffff; --text:#111827; --muted:#6b7280; --faint:#9ca3af;
    --line:#eceff3; --accent:#2563eb; --accent-soft:#eff4ff; --accent-line:#dbe6ff;
    --radius:18px;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    display:flex; justify-content:center; padding:16px 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:430px}
  .card{
    background:var(--card); border-radius:var(--radius); overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.08);
  }

  /* header */
  .head{
    padding:32px 24px 24px; text-align:center;
    background:linear-gradient(180deg,#f7f9ff 0%,#ffffff 100%);
    border-bottom:1px solid var(--line);
  }
  .avatar{
    width:84px; height:84px; border-radius:50%; margin:0 auto 14px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:#fff; font-size:30px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(37,99,235,.28);
  }
  .name{font-size:22px; font-weight:600; letter-spacing:.2px}
  .title{font-size:13px; color:var(--accent); font-weight:500; margin-top:4px}
  .org{font-size:13px; color:var(--muted); margin-top:2px}
  .bio{font-size:13.5px; color:var(--muted); margin-top:14px; line-height:1.7}

  /* actions */
  .actions{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:18px 20px 6px}
  .btn{
    border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent);
    border-radius:12px; padding:12px 6px; font-size:12.5px; font-weight:500;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; transition:transform .12s ease, background .12s ease;
    font-family:inherit; -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn svg{width:20px; height:20px; display:block}

  /* sections */
  .sec{padding:18px 20px; border-top:1px solid var(--line)}
  .sec-title{font-size:12px; color:var(--faint); font-weight:500; letter-spacing:.6px; margin-bottom:12px}

  /* wechat */
  .wx{display:flex; gap:16px; align-items:center}
  .qr{
    width:104px; height:104px; flex:0 0 104px; border-radius:12px;
    border:1px dashed #c7d2e0; background:#fafbfe;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:11px; color:var(--faint); line-height:1.5; padding:8px;
  }
  .qr img{width:100%; height:100%; object-fit:contain; border-radius:10px}
  .wx-info{flex:1; min-width:0}
  .wx-id{font-size:15px; font-weight:500; word-break:break-all}
  .hint{font-size:11.5px; color:var(--faint); margin-top:4px}
  .copy{
    margin-top:10px; border:1px solid var(--accent-line); background:#fff; color:var(--accent);
    border-radius:9px; padding:7px 14px; font-size:12.5px; font-weight:500;
    cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent;
  }
  .copy:active{background:var(--accent-soft)}

  /* rows */
  .row{
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-bottom:1px solid var(--line); text-decoration:none; color:inherit;
  }
  .row:last-child{border-bottom:none}
  .row .ico{
    width:36px; height:36px; flex:0 0 36px; border-radius:10px;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .row .ico svg{width:18px; height:18px}
  .row .txt{flex:1; min-width:0}
  .row .k{font-size:11.5px; color:var(--faint)}
  .row .v{font-size:14px; font-weight:500; word-break:break-all}
  .row .go{color:#c3cad6; font-size:16px}

  /* works */
  .works{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .work{
    border:1px solid var(--line); border-radius:12px; padding:14px 12px;
    background:#fafbfe; min-height:76px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .work .wt{font-size:13px; font-weight:500}
  .work .wd{font-size:11.5px; color:var(--faint); margin-top:4px}

  .foot{padding:18px 20px 26px; text-align:center; border-top:1px solid var(--line)}
  .foot p{font-size:11.5px; color:var(--faint)}
  .foot .brand{margin-top:6px; font-size:11.5px; color:#c3cad6}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px);
    background:rgba(17,24,39,.92); color:#fff; font-size:13px;
    padding:10px 18px; border-radius:10px; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:99; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <!-- ===== 头部：改这里 ===== -->
    <div class="head">
      <div class="avatar">张</div>
      <div class="name">张三</div>
      <div class="title">产品经理</div>
      <div class="org">某某科技有限公司</div>
      <div class="bio">专注于智能硬件与消费电子，热爱折腾 NFC 和一切能"碰一碰"的东西。</div>
    </div>

    <!-- ===== 快捷操作 ===== -->
    <div class="actions">
      <button class="btn primary" onclick="saveVCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        存通讯录
      </button>
      <a class="btn" href="tel:+8613800138000">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        打电话
      </a>
      <button class="btn" onclick="shareCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
        分享
      </button>
    </div>

    <!-- ===== 微信 ===== -->
    <div class="sec">
      <div class="sec-title">微信</div>
      <div class="wx">
        <div class="qr" id="wxqr">把这里换成<br>你的微信二维码</div>
        <div class="wx-info">
          <div class="wx-id" id="wxid">zhangsan_wx</div>
          <div class="hint">长按二维码识别，或复制微信号添加</div>
          <button class="copy" onclick="copyText('zhangsan_wx','微信号')">复制微信号</button>
        </div>
      </div>
    </div>

    <!-- ===== QQ ===== -->
    <div class="sec">
      <div class="sec-title">QQ</div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a6 6 0 0 0-6 6c0 1.4.5 2.6 1.2 3.6C6 13 5 14.7 5 16.5 5 19 7 21 12 21s7-2 7-4.5c0-1.8-1-3.5-2.2-4.9A6 6 0 0 0 18 8a6 6 0 0 0-6-6z"/></svg></div>
        <div class="txt">
          <div class="k">QQ 号</div>
          <div class="v">123456789</div>
        </div>
        <button class="copy" style="margin:0" onclick="copyText('123456789','QQ 号')">复制</button>
      </div>
    </div>

    <!-- ===== 联系方式 ===== -->
    <div class="sec">
      <div class="sec-title">联系方式</div>
      <a class="row" href="tel:+8613800138000">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
        <div class="txt"><div class="k">手机</div><div class="v">138 0013 8000</div></div>
        <div class="go">›</div>
      </a>
      <a class="row" href="mailto:zhangsan@example.com">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></div>
        <div class="txt"><div class="k">邮箱</div><div class="v">zhangsan@example.com</div></div>
        <div class="go">›</div>
      </a>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div class="txt"><div class="k">所在地</div><div class="v">中国 · 深圳</div></div>
      </div>
    </div>

    <!-- ===== 作品展示 ===== -->
    <div class="sec">
      <div class="sec-title">作品 / 展示</div>
      <div class="works">
        <div class="work"><div class="wt">NFC 智能名片</div><div class="wd">碰一碰弹出个人主页</div></div>
        <div class="work"><div class="wt">作品名称</div><div class="wd">一句话介绍</div></div>
        <div class="work"><div class="wt">作品名称</div><div class="wd">一句话介绍</div></div>
        <div class="work"><div class="wt">作品名称</div><div class="wd">一句话介绍</div></div>
      </div>
    </div>

    <div class="foot">
      <p>碰一碰，认识一下</p>
      <p class="brand">NFC 智能名片 · 演示版</p>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 改这里：你的资料 ================= */
var PROFILE = {
  firstName: '三', lastName: '张', full: '张三',
  org: '某某科技有限公司',
  title: '产品经理',
  tel: '+8613800138000',
  email: 'zhangsan@example.com',
  addr: '中国 · 深圳',
  wechat: 'zhangsan_wx',
  qq: '123456789'
};
/* ================================================== */

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function copyText(text, label){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){
      toast('已复制' + label);
    }).catch(function(){ fallbackCopy(text, label); });
  } else {
    fallbackCopy(text, label);
  }
}
function fallbackCopy(text, label){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制' + label); }
  catch(e){ toast('复制失败，请手动复制'); }
  ta.remove();
}

function buildVCard(){
  var p = PROFILE;
  var lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:' + p.lastName + ';' + p.firstName + ';;;',
    'FN:' + p.full,
    'ORG:' + p.org,
    'TITLE:' + p.title,
    'TEL;TYPE=CELL:' + p.tel,
    'EMAIL;TYPE=INTERNET:' + p.email,
    'URL:' + location.href,
    'X-WEIXIN:' + p.wechat,
    'X-QQ:' + p.qq,
    'ADR;TYPE=WORK:;;;' + p.addr + ';;;;',
    'NOTE:微信号 ' + p.wechat + ' / QQ ' + p.qq,
    'END:VCARD'
  ];
  return lines.join('\r\n');
}

function saveVCard(){
  var blob = new Blob(['\ufeff' + buildVCard()], {type:'text/vcard;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = PROFILE.full + '.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast('名片已下载，去通讯录导入');
}

function shareCard(){
  var data = { title: PROFILE.full + ' · 个人名片', text: '这是我的名片', url: location.href };
  if (navigator.share) {
    navigator.share(data).catch(function(){});
  } else {
    copyText(location.href, '链接');
  }
}
</script>
</body>
</html>
